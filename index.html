<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Commitment Tracker</title>
<meta name="theme-color" content="#F5EFE3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Commitments">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#F5EFE3; --card:#FBF8F1; --card2:#EDE4D2;
  --ink:#4A3F32; --muted:#8C7F6B; --faint:#C7B99E;
  --line:#DDD3C0; --track:#E3D9C6;
  --terra:#C05F3C; --green:#5E7A4E; --ochre:#C79A3B; --plum:#8A5A66; --slate:#5F7480;
  --danger:#9C3B2E;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);min-height:100vh;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:620px;margin:0 auto;padding:26px 22px 40px}
button{font-family:var(--sans);cursor:pointer;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.98)}
input,select{font-family:var(--sans)}

.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
h1{font-size:22px;font-weight:500;margin:0 0 4px}
.sub{font-size:14px;color:var(--muted);margin:0;line-height:1.5}
.headrow{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.iconbtn{width:38px;height:38px;border-radius:50%;background:var(--card2);border:none;
  display:flex;align-items:center;justify-content:center;color:#7A6B4F;flex:none}
.iconbtn svg{width:18px;height:18px}
.icons{display:flex;gap:8px}
.backbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--faint);background:transparent;
  display:flex;align-items:center;justify-content:center;color:#7A6B4F;flex:none}
.backbtn svg{width:17px;height:17px}

.row{border-top:1px solid var(--line);padding:18px 0;display:flex;align-items:center;gap:14px}
.row:last-of-type{border-bottom:0}
.chk{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--faint);background:transparent;
  flex:none;display:flex;align-items:center;justify-content:center;color:var(--bg);padding:0}
.chk.done{border:none}
.chk svg{width:15px;height:15px}
.rowmain{flex:1;min-width:0}
.rowname{font-size:16px;font-weight:500;margin:0 0 6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{font-size:11px;letter-spacing:.04em;padding:2px 8px;border-radius:10px;background:var(--card2);color:#7A6B4F;font-weight:400}
.badge.gold{background:#F0E2C0;color:#7D5F1E}
.track{height:2px;background:var(--track)}
.fill{height:2px}
.rowstats{font-size:12px;color:var(--muted);margin:6px 0 0}
.rowstats .warn{color:var(--danger)}
.bignum{font-family:var(--serif);font-size:30px;margin:0;flex:none;min-width:44px;text-align:right}

.cta{display:block;width:100%;border:1px solid var(--ink);border-radius:2px;background:transparent;
  padding:12px;text-align:center;font-size:14px;color:var(--ink);letter-spacing:.04em;margin-top:18px}
.cta.soft{border-color:var(--faint);color:#7A6B4F}
.cta.filled{background:var(--ink);color:var(--bg)}
.cta.dangerline{border-color:var(--danger);color:var(--danger)}
.topline{border-top:1px solid var(--line);margin-top:4px}
.allDone{background:var(--card2);border-radius:14px;padding:12px 16px;font-size:13px;color:#5C513E;
  margin:16px 0 0;text-align:center;line-height:1.5}
.empty{text-align:center;color:var(--muted);padding:44px 0;font-size:14px;line-height:1.7}

.card{background:var(--card);border-radius:22px;padding:16px 18px;margin-bottom:12px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.tile{background:var(--card);border-radius:18px;padding:12px}
.tile p{margin:0}
.tlabel{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px !important}
.tval{font-size:20px;font-weight:500}
.cardhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.cardhead p{margin:0;font-size:14px;font-weight:500}
.cardhead span{font-size:12px}
.tl{margin-top:8px}
.tl summary{font-size:12px;color:var(--muted);cursor:pointer;list-style-position:inside}
.tl p{font-size:12px;color:var(--muted);margin:8px 0 0;display:flex;align-items:center;gap:8px}
.tl p i{width:8px;height:8px;border-radius:50%;flex:none;font-style:normal}
.tl .tld{color:var(--ink);min-width:78px;font-weight:500}

.hero{font-family:var(--serif);font-size:72px;text-align:center;margin:18px 0 0;line-height:1}
.herosub{text-align:center;font-size:13px;color:var(--muted);margin:6px 0 22px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:4px;justify-content:center;margin:4px 0 8px}
.heat span{width:13px;height:13px;border-radius:4px;background:var(--track)}
.heat span[data-d]{cursor:pointer}
.heat span.off{background:transparent}
.heat span.joker{background:var(--ochre);opacity:.55}
.heatlegend{display:flex;gap:14px;justify-content:center;font-size:11px;color:var(--muted);margin-bottom:6px}
.heatlegend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;font-style:normal}

label.f{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
input[type=text],input[type=number],input[type=time],input[type=date],select{
  width:100%;padding:13px 14px;background:var(--card);border:1px solid var(--line);
  border-radius:2px;color:var(--ink);font-size:16px;outline:none}
input:focus,select:focus{border-color:var(--ink)}
/* Date-Input direkt unter einem Segment-Umschalter — gleicher Abstand wie dort. */
.dateline{margin-top:8px}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:12px;border:1px solid var(--line);background:var(--card);border-radius:2px;
  font-size:14px;color:var(--muted)}
.seg button.on{border-color:var(--ink);color:var(--ink);font-weight:500}
.inline{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:14px;color:var(--muted)}
.inline input[type=checkbox]{width:20px;height:20px;accent-color:var(--ink)}
.setrow{border-top:1px solid var(--line);padding:16px 0;display:flex;align-items:center;justify-content:space-between;gap:14px}
.setrow .l{font-size:15px;margin:0}
.setrow .d{font-size:12px;color:var(--muted);margin:3px 0 0;line-height:1.5}
.setrow input[type=time],.setrow input[type=number],.setrow select{width:auto;min-width:96px;padding:9px 10px;font-size:15px}
.switch{position:relative;width:46px;height:27px;flex:none}
.switch input{opacity:0;width:0;height:0}
.knob{position:absolute;inset:0;background:var(--track);border-radius:14px;transition:.2s}
.knob:before{content:"";position:absolute;width:21px;height:21px;left:3px;top:3px;background:var(--card);border-radius:50%;transition:.2s}
.switch input:checked + .knob{background:var(--green)}
.switch input:checked + .knob:before{transform:translateX(19px)}
.note{font-size:12px;color:var(--muted);line-height:1.6;margin:10px 0 0}
.actions2{display:flex;gap:10px}
.actions2 .cta{flex:1}
.hidden{display:none}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 18px;border-radius:14px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .3s;max-width:88%;text-align:center}
.toast.show{opacity:1}

/* Login- und Startbildschirm.
   :not(.hidden), damit das display:flex die .hidden-Regel nicht ueberholt. */
.gate:not(.hidden){min-height:80vh;display:flex;align-items:center;justify-content:center;text-align:center}
.gatebox{width:100%;max-width:330px}
.gatebox h1{margin:0 0 8px}
.gatebox .sub{margin:0}
.gatemark{width:56px;height:56px;border-radius:50%;background:var(--card2);color:var(--terra);
  margin:0 auto 22px;display:flex;align-items:center;justify-content:center}
.gatemark svg{width:24px;height:24px}
.gatebox .cta{margin-top:28px}
.gatebox .note{text-align:center}
.gdot{width:26px;height:26px;border-radius:50%;border:2px solid var(--faint);margin:0 auto;
  border-top-color:var(--terra);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>

<div class="wrap gate" id="boot">
  <div class="gatebox"><div class="gdot"></div></div>
</div>

<div class="wrap gate hidden" id="gate">
  <div class="gatebox">
    <div class="gatemark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>
    </div>
    <p class="eyebrow">Commitment Tracker</p>
    <h1>Willkommen</h1>
    <p class="sub">Melde dich an, damit deine Commitments sicher sind und auf all deinen Geräten gleich aussehen.</p>
    <button class="cta filled" id="gateBtn">Mit Google anmelden</button>
    <p class="note" id="gateErr" style="color:var(--danger)"></p>
  </div>
</div>

<div class="wrap hidden" id="app"></div>
<div class="toast" id="toast"></div>

<script type="module" src="app.js"></script>
</body>
</html>
