name: Deploy to GitHub Pages

# Statt "Deploy from a branch" laeuft die Veroeffentlichung ueber Actions.
# Das umgeht das Branch-Dropdown in den Pages-Einstellungen und deployt bei
# jedem Push auf main automatisch.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Laufende Deployments nicht abwuergen, aber auch nicht parallel fahren.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # Cache-Version aus dem Commit ableiten, statt sie von Hand hochzuzaehlen.
      # Vergisst man das, ziehen installierte PWAs das Update nicht — genau der
      # Fehler, den niemand bemerkt, bis sich jemand ueber alte Daten wundert.
      - name: Cache-Version setzen
        run: |
          set -euo pipefail
          if ! grep -q 'const CACHE = "ct-dev";' sw.js; then
            echo "::error::Platzhalter 'ct-dev' steht nicht mehr in sw.js. Ohne ihn bliebe die" \
                 "Cache-Version bei jedem Deployment gleich und Updates kaemen nicht an."
            exit 1
          fi
          sed -i "s/const CACHE = \"ct-dev\";/const CACHE = \"ct-${GITHUB_SHA:0:7}\";/" sw.js
          grep -m1 'const CACHE' sw.js

      # enablement: true schaltet Pages per API ein, falls es noch aus ist.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # Die App ist statisch: das Repository-Wurzelverzeichnis ist die Seite.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
